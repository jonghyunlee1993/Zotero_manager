# Zotero library ontology: the single source of truth for the tag vocabulary and the collection tree.
# The rules are explained in SCHEMA.md. When you change this file, add an entry to the SCHEMA.md changelog.
version: "1.7"
updated: 2026-10-09

# ─────────────────────────────────────────────────────────────
# Tag format: "<axis>:<name>"   e.g. m:GAN, d:H&E, type:review   (no numbers)
#   A tag listed under a group is a child tag; the group name is its parent tag (e.g. m:generative).
#   Hierarchy rule (H1): a paper carrying a child tag must also carry its parent tag.
#     m:GAN → also m:generative. A parent tag alone is allowed when no child fits.
#   Tags under `ungrouped` have no parent. Group and tag names must be unique within an axis.
#   When a tag moves to another group, swap the parent tag on its papers.
# status: active | user-exception (below the T1 threshold but kept at the user's request; exempt from T3 pruning)
# ─────────────────────────────────────────────────────────────

# Never add, remove, rename or delete these; always excluded from bulk operations.
protected_tags: ["/unread", "/star"]

# Open-vocabulary axes: values are not fixed in advance.
open_axes:
  model:
    format: "model:<official name>"     # e.g. model:TITAN, model:CONCH, model:CHIEF
    limit: [0, 2]
    rule: "Apply only when the paper itself proposes the model or tool and its official name appears in the title or abstract. Do not tag baselines used for evaluation. Dataset and benchmark names are not models. Keep the paper's spelling and replace spaces with hyphens"

# Lab axis (closed vocabulary): only the labs listed here, named by the PI's surname.
labs:
  format: "lab:<PI surname>"
  limit: [0, 3]
  rule: "Apply when the lab's PI appears anywhere in the author list. Check first names and, for common names, the affiliation so namesakes are not tagged"
  tags:
    "lab:Zou":      {pi: "James Zou", affiliation: "Stanford"}
    "lab:Chen":     {pi: "Hao Chen", affiliation: "HKUST"}
    "lab:Xie":      {pi: "Weidi Xie", affiliation: "Shanghai Jiao Tong University"}
    "lab:Mahmood":  {pi: "Faisal Mahmood", affiliation: "Harvard / Mass General Brigham"}
    "lab:Huang":    {pi: "Zhi Huang", affiliation: "University of Pennsylvania (formerly Stanford)"}
    "lab:Kather":   {pi: "Jakob Nikolas Kather", affiliation: "TU Dresden"}

inbox: 00_Inbox       # Staging collection for new papers. Triage moves papers out of it
views: [00_MyPublications]   # Extra-membership collections: a paper also sits here besides its home collection. Not a home, ignored by E1/E2

limits:        # tags per paper, parent tags not counted (any axis may be empty, but at least 1 in total; an omitted domain default counts as 1)
  m: [0, 3]
  d: [0, 3]
  t: [0, 2]
  type: [0, 2]
  a: [0, 2]
  min_total: 1

defaults:      # Domain defaults: omitted on papers whose home collection is in that domain (rule T5), together with their parent tag
  10_Pathology: ["d:H&E"]
  30_Molecules_Drugs: ["d:molecule"]
  50_BioSequenceFMs: ["d:protein"]

axes:
  m:
    name: method
    groups:
      representation-learning:
        SSL: {def: "self-supervised pretraining (MIM etc.)"}
        contrastive: {def: "contrastive learning, including cross-modal alignment"}
        JEPA: {def: "joint-embedding predictive architectures"}
        distillation: {def: "knowledge distillation"}
      generative:
        diffusion: {}
        flow-matching: {}
        VAE: {}
        GAN: {status: user-exception}
      adaptation-setting:
        fine-tuning: {def: "full fine-tuning, PEFT, adapters"}
        prompt-learning: {def: "prompt tuning for vision/CLIP-style models (LLM prompting is m:LLM)"}
        few-shot: {}
        domain-adaptation: {def: "domain adaptation, test-time adaptation, continual learning"}
        federated: {}
      set-aggregation:
        MIL: {}
        prototype: {}
      graph:
        GNN: {}
        hypergraph: {}
      architecture:
        attention: {def: "only when the attention/transformer mechanism itself is the contribution (merely using a transformer gets no tag)"}
        MoE: {}
        state-space: {}
        hyperbolic: {def: "hyperbolic geometry representations (not hypergraphs)"}
      language-models:
        LLM: {def: "LLMs and domain language models (including chemical and protein LMs)"}
        VLM: {}
        agent: {}
      multimodal:
        multimodal-fusion: {}
        OT: {def: "optimal transport"}
      decision-causal:
        RL: {}
        causal-inference: {}
      interpretability-methods:
        SAE: {}
        concept: {status: user-exception, def: "concept-based explanation, concept bottlenecks"}
      data-centric:
        data-augmentation: {status: user-exception, def: "data augmentation, mixup, training with synthetic data"}
        noisy-imbalanced-labels: {status: user-exception, def: "label noise, class imbalance, weak labels"}
    ungrouped:
      ensemble: {}

  d:
    name: data / modality
    groups:
      tissue-imaging:
        "H&E": {def: "domain default in 10_Pathology, so not applied there"}
        IHC: {}
        "3D-pathology": {}
        cytology: {status: user-exception, def: "cytopathology and smears (including blood smears)"}
      spatial-omics:
        ST: {def: "spatial transcriptomics"}
        spatial-proteomics: {def: "mIF, CODEX, IMC, CyCIF"}
      single-cell:
        scRNA: {def: "scRNA-seq, including multiome and ATAC"}
        cytometry: {}
      bulk-molecular:
        bulk-RNA: {}
        methylation: {}
        proteomics: {def: "protein abundance measurements (plasma, MS). Sequences and structures are d:protein"}
        genomics: {def: "DNA sequence, variant panels, somatic variants"}
        genotype: {def: "GWAS, PRS, germline variants"}
      molecules-proteins:
        molecule: {def: "domain default in 30_Molecules_Drugs"}
        protein: {def: "protein sequence and structure. Domain default in 50_BioSequenceFMs"}
      clinical-data:
        clinical: {def: "EHR, clinical variables, claims and diagnosis codes"}
        time-series: {status: user-exception, def: "clinical, wearable and physiological signal time series"}
      general-imaging:
        image: {def: "natural / general images"}
        medical-image: {def: "non-pathology medical imaging (radiology, endoscopy, dermatology)"}
      structured-language:
        text: {def: "only when natural language is a central input or output (not mere prompting)"}
        tabular: {}
        graph: {status: user-exception, def: "graph-structured data"}
        knowledge-graph: {}

  t:
    name: task
    groups:
      molecular-prediction:
        expr-prediction: {def: "gene expression / ST prediction"}
        biomarker-prediction: {def: "mutation, MSI, TMB, molecular subtype, methylation status prediction"}
      batch-effect:
        batch-correction: {def: "correcting or evaluating batch, scanner and site differences"}
        stain-normalization: {status: user-exception, def: "stain normalization and separation"}
      clinical-prediction:
        classification: {def: "diagnosis, subtyping. Not applied when any more specific t: tag applies"}
        survival: {def: "time-to-event analysis"}
        risk-prediction: {def: "predicting disease onset or clinical outcomes (not time-to-event)"}
        treatment-response: {}
        treatment-policy: {def: "treatment policy optimization, treatment effect estimation"}
      synthesis-reconstruction:
        generation: {}
        virtual-staining: {}
        super-resolution: {}
        compression: {}
      cell-tissue-analysis:
        segmentation: {def: "segmentation, detection"}
        cell-annotation: {def: "cell-type labelling, gating"}
        registration: {status: user-exception, def: "image registration (slide-to-slide, cross-modality)"}
      omics-analysis:
        integration: {}
        deconvolution: {}
        perturbation: {}
        GRN: {status: user-exception, def: "gene regulatory network inference"}
      molecular-design:
        mol-optimization: {}
        binding: {}
        property-prediction: {def: "molecule / protein property prediction"}
      language-tasks:
        report-gen: {}
        VQA: {}
        retrieval: {}
        reasoning: {}
      trustworthiness:
        uncertainty: {status: user-exception, def: "uncertainty, calibration"}
        interpretability: {}
        fairness: {status: user-exception, def: "fairness, demographic bias, confounding bias"}
    ungrouped:
      representation: {def: "general-purpose representation / FM pretraining as the goal itself"}
      anomaly-detection: {status: user-exception, def: "anomaly and out-of-distribution detection"}

  type:
    name: paper type (omitted for ordinary method papers)
    ungrouped:
      review: {}
      perspective: {}
      benchmark: {}
      dataset: {}
      tool: {}
      analysis: {def: "analyzes or evaluates existing models/data without a new method (including LLM reliability and pitfall studies)"}
      clinical-validation: {status: user-exception, def: "clinical, multi-site or prospective validation"}
      non-ML: {def: "non-ML biological or clinical research (cohorts, association studies, experimental techniques)"}

  a:
    name: disease / biology area (optional; no oncology tag since it is the default)
    ungrouped:
      immunology: {}
      aging: {status: user-exception}

# ─────────────────────────────────────────────────────────────
# Collection tree (problem axis). Each paper lives in exactly one leaf.
# ─────────────────────────────────────────────────────────────
collections:
  10_Pathology:
    children:
      11_FoundationModels:
        scope: "Pretraining, ensembling, distillation and general adaptation (PEFT) of general-purpose patch/slide encoders. Includes VLM encoders used image-only and stain-agnostic image encoders (including mIF FMs)"
        excludes: ["trained or tuned for specific labels → 12", "output is a molecular prediction → 13", "output is text or dialogue → 14"]
      12_SlideRepresentation:
        scope: "WSI-level aggregation and representation: MIL, prototypes, graphs, 3D, few-shot WSI classification, summarization / token compression, disease-specific WSI classifiers, WSI prediction with text prompts (no molecular data)"
        excludes: ["target or input is molecular → 13", "general-purpose pretraining → 11"]
      13_HistologyToMolecular:
        scope: "Combining or predicting between tissue images and molecular data: ST, bulk and mutation prediction, virtual staining (IHC/mIF), survival prediction fusing molecular data, super-resolution of molecular maps. Includes survival prediction that also fuses reports (d:text)"
        excludes: ["output is text or the model is conversational → 14", "omics integration / deconvolution where imaging is optional → 22", "inferring cell types or states from H&E → 16"]
      14_LanguageReportsAgents:
        scope: "Pathology VLMs/MLLMs, report generation, VQA, reasoning, agents, processing of pathology report text"
        excludes: ["not pathology-specific → 93"]
      15_Robustness:
        scope: "Batch effects, stain normalization, scanner and site shift, fairness, federated learning, privacy. Evaluation studies where shift or bias is the key variable"
        excludes: ["single-cell batch effects → 22"]
      16_CellLevel:
        scope: "Cell and tissue segmentation, cell classification and morphology, IHC quantification, inferring cell types or states from H&E"
      17_ImagingInfra:
        scope: "Compression, image super-resolution / restoration / generation, registration, tooling, deployment, inference acceleration (no new weights)"
        excludes: ["super-resolution of molecular maps → 13", "retrained or distilled FMs → 11"]
      18_DataBenchmarks:
        scope: "General-purpose datasets, benchmarks and resources not tied to one problem"
        excludes: ["benchmark for a specific problem → that problem's collection + type:benchmark"]
      19_General:
        scope: "Domain-wide reviews and perspectives, experimental techniques and resources (type:non-ML / type:tool), papers that fit no specific problem (anomaly detection, aging clocks, etc.)"
  20_SingleCell_Spatial:
    children:
      21_FoundationModels:
        scope: "scRNA / ST / multiome FMs, tokenizers, zero-shot evaluation"
        excludes: ["cytometry is the main modality → 23 (even for FMs)"]
      22_Integration_BatchEffect:
        scope: "Data integration, batch correction, deconvolution, cross-modal mapping (no pretraining)"
        excludes: ["model presented as a pretrained FM → 21"]
      23_Cytometry_Clinical:
        scope: "Cytometry analysis, FMs and gating; sample-level clinical prediction (including MIL)"
        excludes: ["main claim is cross-technology harmonization or batch correction → 22"]
      24_Perturbation_VirtualCell:
        scope: "Perturbation and intervention response, virtual cells, drug response prediction"
      29_General:
        scope: "Domain-wide reviews, experimental techniques, databases and QC tools, and not-yet-split topics such as cell state, trajectories, communication and annotation (consider 25_CellState at 15 papers)"
  30_Molecules_Drugs:
    children:
      31_Design_Optimization:
        scope: "De novo generation, scaffolds, multi-property optimization, general algorithms specific to molecular data"
      32_Interaction_Binding:
        scope: "DTI, DDI, binding affinity, pockets, drug–disease association (repurposing)"
        excludes: ["protein–protein and immune-receptor binding → 50"]
      33_Property_Representation:
        scope: "Molecular property prediction, ADMET, molecular representation pretraining and alignment"
      39_General:
        scope: "Multi-task molecular LLMs, drug-discovery agents and platforms, domain reviews"
  40_Clinical_Population:
    scope: "Clinical and population data research: EHR and clinical trajectory models, treatment-policy RL, bulk omics and genetic cohorts (GWAS, PRS), physiological signals, LLMs on clinical cases and dialogue and their evaluation, specialty-level precision-medicine reviews"
    excludes: ["pathology-specific → 14", "general-purpose multi-domain LLMs → 93"]
  50_BioSequenceFMs:
    scope: "Protein / DNA / RNA language models, structure prediction, methylation FMs, protein–protein binding"
  90_Methods:
    children:
      91_Architectures_SSL_Generative:
        scope: "Architecture internals (attention, SSMs, memory), vision SSL, generative models (GAN, diffusion, VAE), graphs and hyperbolic geometry"
        excludes: ["language is the central modality → 92"]
      92_Multimodal_VLM:
        scope: "Multimodal / VLM training, adaptation and alignment"
      93_LLMs:
        scope: "LLM capabilities, reasoning, evaluation, reliability, alignment and agents; biomedical agents spanning several domains"
        excludes: ["pathology-specific → 14", "EHR / population data → 40", "one domain's data only → that domain"]
      99_General:
        scope: "Other ML: theory, Bayesian methods, uncertainty, label noise, tabular, XAI, general RL, general algorithms (clustering etc.)"
    note_interpretability: "Model interpretation / explanation studies go in the collection of the model being interpreted, with t:interpretability (e.g. pathology FM interpretation → 11, MIL explanation → 12). No separate collection"
    note: "Non-pathology medical imaging (radiology, endoscopy, dermatology) is placed by method in 9x with d:medical-image until it gets its own domain (C4: 30 papers)"

# ─────────────────────────────────────────────────────────────
# Recorded rule-check decisions: the checker shows these whenever it flags the same target again.
# ─────────────────────────────────────────────────────────────
reviews:
  - {rule: C1, target: 13_HistologyToMolecular, date: 2026-10-08, result: hold,
     reason: "8 of the 43 expression-prediction papers overlap with survival/biomarker work, so boundary clarity is 81% < 90%. Use the t:expr-prediction tag instead"}
  - {rule: C2, target: 29_General, date: 2026-10-08, result: hold,
     reason: "Largest sub-bundle (cell-state analysis) is about 11 papers < 15. Consider 25_CellState at 15"}
  - {rule: C2, target: 39_General, date: 2026-10-08, result: hold, reason: "No sub-bundle reaches 15 papers"}
  - {rule: C2, target: 99_General, date: 2026-10-08, result: hold, reason: "Largest sub-bundle is 4 papers"}
  - {rule: C3, target: 24_Perturbation_VirtualCell, date: 2026-10-08, result: hold,
     reason: "3-month grace period for a new collection. Merge into 21 or 29 if still below 5 afterwards"}
  - {rule: T2, target: "d:text", date: 2026-10-08, result: hold, reason: "Narrowed the definition and re-tagged (147 → 107). No sub-type worth filtering"}
  - {rule: T2, target: "t:classification", date: 2026-10-08, result: hold, reason: "Reduced by the rule that it applies only when no more specific t: tag does"}
  - {rule: T2, target: "m:LLM", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "m:VLM", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "d:ST", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "m:SSL", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "m:MIL", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "t:survival", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "m:contrastive", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "t:expr-prediction", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "d:scRNA", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "d:image", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "t:representation", date: 2026-10-08, result: hold, reason: "The cross-domain FM view is the point of this tag. Collections 11/21/50 already split it"}
  - {rule: T2, target: "m:multimodal-fusion", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}
  - {rule: T2, target: "m:fine-tuning", date: 2026-10-08, result: hold, reason: "No sub-type worth filtering"}

# ─────────────────────────────────────────────────────────────
# Migration aliases: tag and collection names from earlier drafts → current names.
# Numbered tags from v1.1–v1.5 ("m:1104 GAN") are mapped automatically by dropping the number.
# null = dropped (not tagged). Used by `check_schema.py --draft`. Can be removed once no old drafts remain.
# ─────────────────────────────────────────────────────────────
legacy_aliases:
  tags:
    "d:mIF": "d:spatial-proteomics"
    "d:EHR": "d:clinical"
    "d:GWAS": "d:genotype"
    "d:wearable-signal": "d:time-series"
    "d:radiology": "d:medical-image"
    "t:representation-learning": "t:representation"
    "t:evaluation": "type:analysis"
    "t:detection": "t:segmentation"
    "t:image-translation": "t:generation"
    "t:policy-learning": null
    "t:treatment-effect": "t:treatment-policy"
    "type:empirical-study": "type:non-ML"
    "type:wet-lab": "type:non-ML"
    "m:concept-based": "m:concept"
    "m:concept-bottleneck": "m:concept"
    "m:autoencoder": null
    "m:transformer": null
    "m:language-model": "m:LLM"
    "m:alignment": "m:contrastive"
    "m:continual-learning": "m:domain-adaptation"
    "t:language-modeling": null
    "d:multi-omics": null
    "t:calibration": "t:uncertainty"
    "t:batch-effect": "t:batch-correction"
  collections:
    "91_Architectures_SSL": "91_Architectures_SSL_Generative"
    "93_LLM_Agents": "93_LLMs"
