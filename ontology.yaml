    "type:empirical-study": "type:1008 non-ML"
    "type:wet-lab": "type:1008 non-ML"
    "m:concept-based": "m:1902 concept"
    "m:concept-bottleneck": "m:1902 concept"
    "m:autoencoder": null
    "m:transformer": null
    "m:language-model": "m:1601 LLM"
    "m:alignment": "m:1002 contrastive"
    "m:continual-learning": "m:1204 domain-adaptation"
    "t:language-modeling": null
    "d:multi-omics": null
